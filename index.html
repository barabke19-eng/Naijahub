<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Naija Live Hub</title>

<style>
body{
  background:#0f172a;
  color:white;
  font-family:Arial;
  margin:0;
  padding:0;
}

header{
  background:#16a34a;
  padding:15px;
  text-align:center;
  font-size:22px;
  font-weight:bold;
}

.tabs{
  display:flex;
  overflow:auto;
  background:#111827;
}

.tabs button{
  flex:1;
  padding:12px;
  border:none;
  background:none;
  color:white;
  font-size:16px;
}

.tabs button:hover{
  background:#16a34a;
}

.match{
  background:#1e293b;
  margin:10px;
  padding:15px;
  border-radius:10px;
}

.time{
  color:#22c55e;
  margin-top:5px;
}
</style>
</head>

<body>

<header>Naija Live Hub</header>

<div class="tabs">
  <button onclick="loadLeague('all')">Duka</button>
  <button onclick="loadLeague('PL')">EPL</button>
  <button onclick="loadLeague('PD')">La Liga</button>
  <button onclick="loadLeague('CL')">UCL</button>
</div>

<div id="matches" style="padding:10px;">
Ana dauko matches...
</div>

<script>

const API_KEY = "e0741349cf2cc88e50d3cb78d2775950";
const API_URL = "https://v3.football.api-sports.io/fixtures";

function getLeagueId(code){
  const leagues = {
    'PL':39,
    'PD':140,
    'CL':2
  };

  return leagues[code] || 39;
}

async function loadLeague(league){

  const container = document.getElementById("matches");

  container.innerHTML = "Ana dauko matches...";

  try{

    const today = new Date().toISOString().split('T')[0];

    let url = `${API_URL}?date=${today}`;

    if(league !== 'all'){
      url += `&league=${getLeagueId(league)}`;
    }

    url += "&season=2025&timezone=Africa/Lagos";

    const res = await fetch(url,{
      headers:{
        'x-apisports-key': API_KEY
      }
    });

    if(!res.ok){
      throw new Error("API Error");
    }

    const data = await res.json();

    displayMatches(data.response || []);

  }catch(err){

    container.innerHTML = `
      <h3>An samu matsala!</h3>
      <p>${err.message}</p>
      <p>Tabbatar ka sa API key dinka.</p>
    `;
  }
}

function displayMatches(matches){

  const container = document.getElementById("matches");

  if(matches.length === 0){

    container.innerHTML = "Babu wasa a yau.";

    return;
  }

  container.innerHTML = matches.map(match => `

    <div class="match">
      <h3>
        ${match.teams.home.name}
        vs
        ${match.teams.away.name}
      </h3>

      <div class="time">
        ${new Date(match.fixture.date).toLocaleTimeString('en-US',{
          hour:'2-digit',
          minute:'2-digit'
        })}
      </div>

      <p>${match.league.name}</p>
    </div>

  `).join('');
}

document.addEventListener("DOMContentLoaded", function(){
  loadLeague('all');
});

</script>

</body>
</html>
